<aside class="sidebar" [class.collapsed]="collapsed" >

    <div class="sidebar-header">

        <button
            class="collapse-btn"
            (click)="toggleSidebar()">

            <mat-icon>

                {{ collapsed ? 'menu' : 'menu_open' }}

            </mat-icon>

        </button>

        @if(!collapsed){

            <h2>KPI Manager</h2>

        }

    </div>

    <nav>

        <button routerLink="/dashboard" routerLinkActive="active">
            <mat-icon>dashboard</mat-icon>

            @if(!collapsed){
                <span>Dashboard</span>
            }

        </button>

        <button routerLink="/kpi-management" routerLinkActive="active">
            <mat-icon>track_changes</mat-icon>

            @if(!collapsed){
                <span>KPI Management</span>
            }

        </button>

        <button routerLink="/ai-insights" routerLinkActive="active">

            <mat-icon>psychology</mat-icon>

            @if(!collapsed){
                <span>AI Insights</span>
            }

        </button>

        <button routerLink="/analytics" routerLinkActive="active">

            <mat-icon>analytics</mat-icon>

            @if(!collapsed){
                <span>Analytics</span>
            }

        </button>

        <button routerLink="/reports" routerLinkActive="active">

            <mat-icon>description</mat-icon>

            @if(!collapsed){
                <span>Reports</span>
            }

        </button>

        <button routerLink="/forecasting" routerLinkActive="active">

            <mat-icon>insights</mat-icon>

            @if(!collapsed){
                <span>Forecasting</span>
            }

        </button>


        <button routerLink="/settings" routerLinkActive="active">

            <mat-icon>settings</mat-icon>

            @if(!collapsed){
                <span>Settings</span>
            }

        </button>

    </nav>

</aside>
