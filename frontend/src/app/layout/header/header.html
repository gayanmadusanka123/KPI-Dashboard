<header class="header" [class.collapsed]="collapsed" >

    <div class="left">
        <h2>AI KPI Prediction Dashboard</h2>
    </div>

    <div class="right">

        <button class="icon-btn">
            🔔
        </button>

        <button class="icon-btn">
            ⚙️
        </button>

        <div class="profile">
            <div class="avatar">
                A
            </div>

            <div>
                <p class="name">{{ auth.currentUser?.userName || 'Account' }}</p>
                <span>{{ auth.currentUser?.email || 'Workspace user' }}</span>
            </div>
            <button class="logout-btn" type="button" (click)="logout()">Log out</button>
        </div>

    </div>

</header>
