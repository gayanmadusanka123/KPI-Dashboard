<div class="space-y-5">
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
    <div class="rounded-2xl border p-6" [style.backgroundColor]="C.card" [style.borderColor]="C.border">
      <p class="font-semibold mb-1" [style.color]="C.text">Department KPI vs Target</p>
      <p class="text-xs mb-5" [style.color]="C.sub">Current period</p>
      <app-cartesian-chart
        [data]="deptPerf"
        xKey="dept"
        [series]="deptBarSeries"
        [height]="220"
        [margin]="{ top: 4, right: 4, bottom: 0, left: -24 }"
        [gridVertical]="false"
        [yDomain]="[0, 100]"
        [legend]="true"
      />
    </div>
    <div class="rounded-2xl border p-6" [style.backgroundColor]="C.card" [style.borderColor]="C.border">
      <p class="font-semibold mb-5" [style.color]="C.text">Performance Radar</p>
      <app-radar-chart [data]="deptRadar" nameKey="name" [series]="deptRadarSeries" [height]="220" [legend]="true" />
    </div>
  </div>

  <div class="rounded-2xl border p-6" [style.backgroundColor]="C.card" [style.borderColor]="C.border">
    <p class="font-semibold mb-1" [style.color]="C.text">Team Productivity Heatmap</p>
    <p class="text-xs mb-5" [style.color]="C.sub">Weekly performance by team (0–100)</p>
    <div class="overflow-x-auto">
      <table class="w-full text-xs" style="min-width: 400px">
        <thead>
          <tr>
            <th class="text-left pb-2 pr-4 font-medium w-28" [style.color]="C.sub">Team</th>
            @for (d of days; track d) { <th class="pb-2 font-medium text-center px-1" [style.color]="C.sub">{{ d }}</th> }
          </tr>
        </thead>
        <tbody>
          @for (row of heatRows; track row.team) {
            <tr>
              <td class="pr-4 py-1 font-medium" [style.color]="C.sub">{{ row.team }}</td>
              @for (score of row.scores; track $index) {
                <td class="py-1 px-1">
                  <div class="w-full h-9 rounded-xl flex items-center justify-center font-semibold tabular-nums cursor-pointer transition-transform hover:scale-105"
                    [style.backgroundColor]="heatBg(score)" [style.color]="heatText(score)" [style.border]="heatBorder(score)">
                    {{ score }}
                  </div>
                </td>
              }
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
