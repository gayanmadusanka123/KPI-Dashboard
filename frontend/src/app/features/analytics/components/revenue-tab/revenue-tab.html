<div class="space-y-5">
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
    @for (s of revenueStats; track s.label) {
      <div class="rounded-2xl border p-4" [style.backgroundColor]="C.card" [style.borderColor]="C.border">
        <p class="text-xs mb-1" [style.color]="C.sub">{{ s.label }}</p>
        <p class="text-2xl font-bold tabular-nums" [style.color]="s.color">{{ s.value }}</p>
        <p class="text-xs mt-1 font-semibold" [style.color]="C.success">{{ s.change }} YoY</p>
      </div>
    }
  </div>

  <div class="rounded-2xl border p-6" [style.backgroundColor]="C.card" [style.borderColor]="C.border">
    <p class="font-semibold mb-1" [style.color]="C.text">Revenue, Profit &amp; Expenses</p>
    <p class="text-xs mb-5" [style.color]="C.sub">Monthly breakdown · FY 2024 in $M</p>
    <app-cartesian-chart
      [data]="analyticsRevenue"
      xKey="month"
      [series]="revenueAreaSeries"
      [height]="280"
      [margin]="{ top: 4, right: 4, bottom: 0, left: -10 }"
      [gridVertical]="false"
      [legend]="true"
    />
  </div>

  <div class="rounded-2xl border p-6" [style.backgroundColor]="C.card" [style.borderColor]="C.border">
    <p class="font-semibold mb-5" [style.color]="C.text">Revenue by Channel</p>
    <app-cartesian-chart
      [data]="channelData"
      xKey="channel"
      [series]="channelBarSeries"
      [height]="200"
      layout="vertical"
      [margin]="{ top: 0, right: 20, bottom: 0, left: 20 }"
      [gridHorizontal]="false"
      [yAxisWidth]="60"
    />
  </div>
</div>
