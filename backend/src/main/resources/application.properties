spring.application.name=kpi-dashboard

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5433/kpi_db
spring.datasource.username=kpiuser
spring.datasource.password=kpipassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.kafka.bootstrap-servers=localhost:19093

spring.kafka.consumer.group-id=kpi-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=java.util.HashMap

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

server.port=8081
# Flyway
spring.flyway.enabled=true


#jwt configs
jwt.secret=GQfBAkj3WhEtVRD92bAc3+e43NqZJHihkLlO5bOiruY
jwt.expiration=360000

python.executable=python
python.generator.script.path=ml-service/synthetic/synthetic_generator.py
python.calculator.script.path=ml-service/synthetic/calculator.py

management.endpoints.web.exposure.include=health,info
