version: '3.9'

services:
  postgres:
    image: postgres:16

    container_name: kpi-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: kpi_db
      POSTGRES_USER: kpiuser
      POSTGRES_PASSWORD: kpipassword

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data: